[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
# Enable preview rules.
preview = true
select = ["E", "F", "W", "I", "UP", "FURB", "SIM"]

[tool.ruff.lint.isort]
case-sensitive = false
from-first = true
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "standard"
